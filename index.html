<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DataDash 2.0 Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cy:#22d3e6;--tx:#e9f3ff;--mu:#8aa3bf;--cd:rgba(12,28,50,.82);--ln:rgba(34,211,230,.25)}
*{box-sizing:border-box}html{font-size:18px}html.display{font-size:1.2vw}
body{margin:0;min-height:100vh;color:var(--tx);font:1rem Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background:linear-gradient(115deg,transparent 78%,rgba(34,211,230,.35) 78.2%,transparent 79.5%),radial-gradient(60rem 30rem at 8% -8%,#0f4a7a,transparent 60%),#040b18}
.hd,.wrap{max-width:64rem;margin:auto;padding:.8rem 1rem}html.display .hd,html.display .wrap{max-width:90rem}
.hd{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.pill{background:#fff;border-radius:999px;padding:.35rem 1rem;display:flex;align-items:center;gap:.8rem}.pill img{height:2.4rem}.dd{height:3.6rem}
#live{font:italic 800 1rem 'Barlow Condensed';letter-spacing:.1em;color:#ff4d6d}#live.on{color:#2ee59d}#live:before{content:"● ";animation:p 1.4s infinite}@keyframes p{50%{opacity:.3}}
.grid{display:grid;gap:1rem}html.display .grid{grid-template-columns:1.1fr 1fr}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:1rem;padding:1rem;margin-bottom:1rem}
.tt{font:italic 800 1.15rem 'Barlow Condensed';letter-spacing:.06em;color:var(--cy);margin-bottom:.5rem}
.big{font:italic 800 7rem/1 'Barlow Condensed'}.mu{color:var(--mu)}
.chip{display:inline-block;background:rgba(34,211,230,.12);border:1px solid var(--ln);border-radius:.6rem;padding:.4rem .7rem;margin:.2rem .3rem .2rem 0}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:400;text-align:right}td{text-align:right;padding:.55rem 0;border-top:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}tr.o td{color:var(--mu)}
.ball{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .3rem;border-radius:1rem;background:#12304f;margin-right:.3rem;font-weight:600}.ball.f{background:#0e7490}.ball.s{background:#16a34a}.ball.w{background:#e11d48}
.bar{height:1.2rem;border-radius:1rem;overflow:hidden;display:flex;background:#12304f}.bar i{display:block;background:var(--cy)}.sp{display:flex;justify-content:space-between;margin-top:.4rem}
.res{font:italic 800 1.8rem 'Barlow Condensed';color:#fbbf24}
input,select,textarea,.b{background:#0b1f38;color:var(--tx);border:1px solid var(--ln);border-radius:.6rem;padding:.6rem .8rem;font:inherit;max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0;align-items:end}.row label{display:grid;gap:.2rem;color:var(--mu)}textarea{flex:1;min-width:12rem}
.b{cursor:pointer}.b:hover{border-color:var(--cy)}.runs{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;margin:.8rem 0}.runs .b{font:italic 800 1.8rem 'Barlow Condensed';padding:.8rem 0}
svg{width:100%;display:block}
.tabs{display:flex;gap:.6rem;padding-bottom:0}.tab{flex:1;background:#0b1f38;color:var(--mu);border:1px solid var(--ln);border-radius:.8rem;padding:.7rem;font:italic 800 1.4rem 'Barlow Condensed';letter-spacing:.06em;cursor:pointer}.tab.on{background:var(--cy);color:#041020}
.vs{display:flex;align-items:stretch;gap:.8rem}.tm{flex:1;border:1px solid var(--ln);border-radius:.8rem;padding:.8rem;text-align:center}.tm.on{border-color:var(--cy);background:rgba(34,211,230,.12)}.nmx{font:italic 800 2.2rem/1.1 'Barlow Condensed'}.vsx{align-self:center;color:var(--cy);font:italic 800 1.5rem 'Barlow Condensed'}
.bn{display:block;width:100%;margin-bottom:1rem;background:linear-gradient(90deg,#0e7490,#12304f);color:#fff;border:1px solid var(--ln);border-radius:.8rem;padding:.8rem 1rem;font:600 1rem Inter,sans-serif;cursor:pointer;text-align:left}
.lb{display:grid;grid-template-columns:9rem 1fr 3rem;gap:.6rem;align-items:center;margin:.6rem 0}.lb b{text-align:right}.lb .bar{height:.9rem}.cheer{background:var(--cy);color:#041020;font:italic 800 1.7rem 'Barlow Condensed';padding:.5rem 2rem}
.dr path{fill:none;stroke:#2b6a9a;stroke-width:2}.dr text{fill:#e9f3ff;font:600 15px Inter,sans-serif}.dr .w{fill:#22d3e6;font-weight:800}.dr .m{fill:#8aa3bf;font-size:11px}.dr .lv{fill:#ff4d6d;font-weight:800}
#bnr{cursor:default;text-align:center;font:italic 800 1.3rem 'Barlow Condensed',sans-serif;letter-spacing:.06em}
</style></head><body>
<div class="hd"><div class="pill"><img src="assets/kdu.png" alt="KDU"><img src="assets/datainspire.png" alt="DatAInspire"></div><span id="live" class="off">LIVE</span><img class="dd" src="assets/datadash.png" alt="DataDash 2.0"></div>
<div class="wrap" style="padding-top:0;padding-bottom:0;display:none"><div class="bn" id="bnr"></div></div>
<nav class="tabs wrap" id="tabs"></nav><main class="wrap" id="app"><div class="cd mu">Waiting for the match to start…</div></main>
<script>
function showErr(m){var d=document.getElementById("app");if(d)d.insertAdjacentHTML("afterbegin",'<div class="cd" style="border-color:#ff4d6d">Page error: '+String(m).replace(/</g,"&lt;")+"</div>")}
addEventListener("error",function(e){var t=e.target;if(t&&t!==window){if(t.tagName==="SCRIPT")showErr("Could not load "+t.src.split("/").pop()+" or a file it needs (check app.js and firebase-config.js are uploaded next to index.html).")}else showErr(e.message)},true);
addEventListener("unhandledrejection",function(e){showErr(e.reason&&e.reason.message||e.reason)});
</script>
<script>
/* Knockout draw: 12 teams A-L as in the sketch */
(function(){
const MT={m1:[2,3],m2:[4,5],m3:[6,7],m4:[8,9],m5:[0,1],m6:[10,11],m7:["m1","m2"],m8:["m3","m4"],m9:["m5","m7"],m10:["m8","m6"],m11:["m9","m10"]};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const X0=190,ST=90,Y0=26,RH=36;
function bracket(tn,win,live){const o=[];
 const node=c=>{
  if(typeof c==="number"){const y=Y0+c*RH;o.push(`<path d="M0 ${y}H${X0}"/><circle class="lt" cx="13" cy="${y-9}" r="12"/><text class="lt" x="13" y="${y-4}" text-anchor="middle">${"ABCDEFGHIJKL"[c]}</text><text x="34" y="${y-6}">${esc(tn(c).slice(0,15))}</text>`);return{x:X0,y,h:0}}
  const a=MT[c].map(z=>node(z)),h=1+Math.max(a[0].h,a[1].h),x=X0+h*ST,y=(a[0].y+a[1].y)/2,w=win(c),lv=live===c;
  o.push(`<path d="M${a[0].x} ${a[0].y}H${x}V${a[1].y}H${a[1].x}"/><text class="m${lv?" lv":""}" x="${x+6}" y="${y+16}">M${c.slice(1)}${lv?" LIVE":""}</text>`);
  if(w!==null)o.push(`<text class="w" x="${x+6}" y="${y-6}">${esc(tn(w).slice(0,12))}</text>`);
  return{x,y,h}};
 const r=node("m11"),w=win("m11");
 o.push(`<path d="M${r.x} ${r.y}h50"/><text class="w" x="${r.x+8}" y="${r.y-8}">${w===null?"Champion":esc(tn(w).slice(0,12))}</text>`);
 return`<svg class="dr" viewBox="0 0 690 450"><style>.dr path{fill:none;stroke:#2b9ac4;stroke-width:2.5}.dr text{fill:#e9f3ff;font:600 19px Inter,sans-serif}.dr .w{fill:#22d3e6;font-weight:800}.dr .m{fill:#8aa3bf;font-size:13px}.dr .lv{fill:#ff4d6d;font-weight:800}.dr circle.lt{fill:#0e7490}.dr text.lt{fill:#fff;font-weight:800;font-size:15px}</style>${o.join("")}</svg>`}
window.bracket=bracket;
})();
</script>
<script type="module" src="app.js?v=8"></script></body></html>
