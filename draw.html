<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataDash 2.0 · Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;color:#e9f3ff;font:16px Inter,system-ui,sans-serif;background:linear-gradient(115deg,transparent 78%,rgba(34,211,230,.35) 78.2%,transparent 79.5%),radial-gradient(60rem 30rem at 8% -8%,#0f4a7a,transparent 60%),#040b18}
.hd,.wrap{max-width:64rem;margin:auto;padding:.8rem 1rem}.hd{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.pill{background:#fff;border-radius:999px;padding:.35rem 1rem;display:flex;gap:.8rem}.pill img{height:2.4rem}.dd{height:3.6rem}
.cd{background:rgba(12,28,50,.82);border:1px solid rgba(34,211,230,.25);border-radius:1rem;padding:1rem}
h1{font:italic 800 1.6rem 'Barlow Condensed',sans-serif;letter-spacing:.06em;color:#22d3e6;margin:0 0 .5rem}a{color:#22d3e6}svg{width:100%;display:block}
</style></head><body>
<div class="hd"><div class="pill"><img src="assets/kdu.png" alt="KDU"><img src="assets/datainspire.png" alt="DatAInspire"></div><img class="dd" src="assets/datadash.png" alt="DataDash 2.0"></div>
<main class="wrap"><div class="cd"><h1>Tournament draw</h1><div id="d"></div></div><p><a href="./">Back to live score</a></p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import{firebaseConfig}from"./firebase-config.js";
import{bracket}from"./draw-view.js";
const db=getDatabase(initializeApp(firebaseConfig));let D={},live="";
const tn=i=>i==null?"?":((D.t||[])[i]||{}).n||"Team "+"ABCDEFGHIJKL"[i],win=m=>{const w=(D.w||{})[m];return w==null?null:+w},show=()=>document.getElementById("d").innerHTML=bracket(tn,win,live);
show();onValue(ref(db,"match"),s=>{const v=s.val()||{};D=v.draw||{};live=v.live||"";show()});
</script></body></html>
